let ac=null,master,sfx,sfxVerb,noiseBuf,musicGain,musicOn=true,musicBus;
function impulse(sec,decay){const sr=ac.sampleRate,len=sr*sec|0,b=ac.createBuffer(2,len,sr);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}return b}
function initAudio(){
  if(ac){if(ac.state!=='running')ac.resume();return}
  try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null;return}
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=8;comp.attack.value=.002;comp.release.value=.2;comp.connect(ac.destination);
  master=ac.createGain();master.gain.value=.85;master.connect(comp);
  sfx=ac.createGain();sfx.connect(master);
  sfxVerb=ac.createConvolver();sfxVerb.buffer=impulse(1.8,3.2);const sv=ac.createGain();sv.gain.value=.35;sfxVerb.connect(sv);sv.connect(master);
  const sr=ac.sampleRate;noiseBuf=ac.createBuffer(1,sr*2,sr);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  initMusic();
}
function nz(t,dur,type,freq,q,vol,attack=.002,verb=0,f1=0){
  if(!ac||vol<.003)return;
  const s=ac.createBufferSource();s.buffer=noiseBuf;const f=ac.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(freq,t);
  if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=q;
  const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(sfx);
  if(verb){const vg=ac.createGain();vg.gain.value=verb;g.connect(vg);vg.connect(sfxVerb)}
  s.start(t,Math.random()*1.4);s.stop(t+dur+.05);
}
function tone(t,dur,type,f0,f1,vol,attack=.003,verb=0){
  if(!ac||vol<.003)return;
  const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(sfx);if(verb){const vg=ac.createGain();vg.gain.value=verb;g.connect(vg);vg.connect(sfxVerb)}
  o.start(t);o.stop(t+dur+.05);
}
const distVol=(x,y)=>player?clamp(1-Math.hypot(x-player.x,y-player.y)/1300,0,1):1;
const SND={
  gun(d){if(!ac)return;const t=ac.currentTime,s=d.snd;
    if(s.k==='sup'){nz(t,.1,'lowpass',1300,1,.38);nz(t,.03,'highpass',4200,1,.18);tone(t+.02,.03,'square',2400,1800,.04);return}
    if(s.k==='bow'){tone(t,.28,'triangle',230,95,.28);nz(t,.22,'bandpass',1400,2,.12,.002,0,500);return}
    if(s.k==='xbow'){tone(t,.14,'square',150,60,.14);nz(t,.07,'highpass',2600,1,.34);nz(t,.3,'bandpass',900,3,.12,.002,0,400);return}
    const v=s.v;
    nz(t,s.d,'lowpass',s.c,.7,v,.001,.7);

    tone(t,s.d*.9,'sine',s.b,s.b*.35,v*.9,.002);

  magOut(){SND.click(.25,1600)}, magIn(){SND.click(.35,1200)}, slide(){if(!ac)return;const t=ac.currentTime;nz(t,.06,'bandpass',2600,2,.28);nz(t+.07,.05,'bandpass',1800,2,.3)},
  swing(d){if(!ac)return;const t=ac.currentTime,dur=Math.max(.12,d.sw*.7);nz(t,dur,'bandpass',2400,1.5,.22,.03,0,500)},
  hit(x,y,heavy,metal){if(!ac)return;const v=distVol(x,y);const t=ac.currentTime;
    nz(t,.12,'bandpass',heavy?500:800,1.2,.45*v);tone(t,.12,'sine',heavy?110:160,50,.5*v);
    if(metal){[820,1290,2150].forEach((f,i)=>tone(t,.45-i*.1,'sine',f,f*.98,.12*v))}},
  splat(x,y){if(!ac)return;const v=distVol(x,y);const t=ac.currentTime;nz(t,.09,'lowpass',900,1,.28*v);nz(t+.02,.12,'bandpass',350,2,.2*v)},
  ricochet(x,y){if(!ac||Math.random()<.6)return;const v=distVol(x,y);const t=ac.currentTime;tone(t,.18,'sine',rand(2500,4000),rand(900,1500),.05*v)},
  step(run){if(!ac)return;const t=ac.currentTime;nz(t,.06,'lowpass',run?520:380,1,run?.16:.09)},
  hurt(){if(!ac)return;const t=ac.currentTime;tone(t,.22,'sawtooth',170,90,.18);nz(t,.15,'lowpass',600,1,.3)},
  groan(x,y,big){if(!ac)return;const v=distVol(x,y)*.22;if(v<.01)return;const t=ac.currentTime,dur=rand(.6,1.3);
    const o=ac.createOscillator();o.type='sawtooth';const f0=big?rand(45,60):rand(70,105);o.frequency.setValueAtTime(f0,t);
    o.frequency.linearRampToValueAtTime(f0*rand(.75,1.1),t+dur*.5);o.frequency.linearRampToValueAtTime(f0*rand(.6,.9),t+dur);
    const lfo=ac.createOscillator();lfo.frequency.value=rand(5,9);const lg=ac.createGain();lg.gain.value=f0*.06;lfo.connect(lg);lg.connect(o.frequency);
    const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(rand(450,700),t);f.frequency.linearRampToValueAtTime(rand(300,500),t+dur);f.Q.value=3;
    const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.12);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(f);f.connect(g);g.connect(sfx);o.start(t);lfo.start(t);o.stop(t+dur+.05);lfo.stop(t+dur+.05)},
  bite(){if(!ac)return;const t=ac.currentTime;nz(t,.1,'bandpass',700,2,.35);tone(t,.1,'sawtooth',90,60,.15)},
  pickup(){if(!ac)return;const t=ac.currentTime;tone(t,.06,'square',660,0,.08);tone(t+.06,.08,'square',990,0,.08)},
  heal(){if(!ac)return;const t=ac.currentTime;[523,659,784].forEach((f,i)=>tone(t+i*.07,.15,'triangle',f,0,.12))},
  heart(){if(!ac)return;const t=ac.currentTime;tone(t,.12,'sine',60,40,.35);tone(t+.18,.12,'sine',55,38,.28)},
  horde(){if(!ac)return;const t=ac.currentTime;for(let i=0;i<6;i++){const ox=player.x+rand(-900,900),oy=player.y+rand(-900,900);setTimeout(()=>SND.groan(player.x+rand(-300,300),player.y+rand(-300,300),Math.random()<.4),i*180)}
    tone(t,2.5,'sawtooth',55,40,.12,.4,.5)},
};
// chainsaw engine (continuous)
let saw=null;
function sawUpdate(active,cutting){
  if(!ac)return;
  if(active&&!saw){const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=48;const o2=ac.createOscillator();o2.type='square';o2.frequency.value=97;
    const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=1200;const g=ac.createGain();g.gain.value=0;
    o.connect(f);o2.connect(f);f.connect(g);g.connect(sfx);o.start();o2.start();saw={o,o2,g,f}}
  if(!saw)return;const t=ac.currentTime;
  if(!active){saw.g.gain.setTargetAtTime(0,t,.05);const s=saw;setTimeout(()=>{try{s.o.stop();s.o2.stop()}catch(e){}},400);saw=null;return}
  saw.o.frequency.setTargetAtTime(cutting?115:48+Math.random()*6,t,.05);saw.o2.frequency.setTargetAtTime(cutting?233:97,t,.05);
  saw.f.frequency.setTargetAtTime(cutting?2600:900,t,.05);saw.g.gain.setTargetAtTime(cutting?.13:.05,t,.05);
}

// ---------- MUSIC: sad fingerpicked acoustic guitar (Karplus-Strong), A minor, no words ----------
const ksCache={};
function ksBuffer(midi,dur=4){
  if(ksCache[midi])return ksCache[midi];
  const sr=ac.sampleRate,freq=440*Math.pow(2,(midi-69)/12),len=Math.floor(sr*dur),buf=ac.createBuffer(1,len,sr),d=buf.getChannelData(0);
  const N=Math.max(2,Math.round(sr/freq)),ring=new Float32Array(N);let prev=0;
  for(let i=0;i<N;i++){const r=Math.random()*2-1;prev+=.55*(r-prev);ring[i]=prev}
  const damp=.9993-freq*.0000035;let idx=0,peak=0;

    const slow=(bar%8===7&&e>=3)?1.25:1;
    const n=c[PAT[e]];pluck(n,mNext+rub,e===0?.36:.17+Math.random()*.05,e===0?-.25:rand(-.15,.15));

const TILE=48,BLK=24,MW=126,MH=126;

let props=[],lamps=[],blights=[],floorTiles=[],walkTiles=[];
const T=(x,y)=>(x<0||y<0||x>=MW||y>=MH)?WALL:map[y*MW+x];
const solid=(x,y)=>{const t=T(x,y);return t===WALL||t===OBST};
const solidAt=(px,py)=>solid(Math.floor(px/TILE),Math.floor(py/TILE));
const setT=(x,y,t,c)=>{if(x<0||y<0||x>=MW||y>=MH)return;map[y*MW+x]=t;if(c!==undefined)fcol[y*MW+x]=c};
function obst(x,y){const i=y*MW+x;if(map[i]===WALL||map[i]===OBST)return false;base[i]=map[i];map[i]=OBST;return true}
const SPX=75,SPY=75;
function genMap(){
  map.fill(GRASS);fcol.fill(0);base.fill(0);props=[];lamps=[];blights=[];floorTiles=[];walkTiles=[];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const ox=x%BLK,oy=y%BLK,rx=ox<=5,ry=oy<=5;
    if(rx||ry){const t=((rx&&ox>=1&&ox<=4)||(ry&&oy>=1&&oy<=4))?ROAD:WALK;setT(x,y,t)}
    if(x===0||y===0||x===MW-1||y===MH-1)setT(x,y,WALL);
  }
  for(let by=0;by<5;by++)for(let bx=0;bx<5;bx++){
    const x0=bx*BLK+6,y0=by*BLK+6,r=Math.random();
    if(r<.66)genBuilding(x0,y0);else if(r<.86)genPark(x0,y0);else genLot(x0,y0);
  }
  // cars on roads
  let cars=0,tries=0;
  while(cars<85&&tries<3000){tries++;
    const x=ri(1,MW-2),y=ri(1,MH-2);if(T(x,y)!==ROAD)continue;
    if(Math.abs(x-SPX)<7&&Math.abs(y-SPY)<7)continue;
    const ox=x%BLK,oy=y%BLK,vRoad=ox>=1&&ox<=4,hRoad=oy>=1&&oy<=4;if(vRoad&&hRoad)continue;
    const vert=vRoad;const x2=vert?x:x+1,y2=vert?y+1:y;if(T(x2,y2)!==ROAD)continue;
    if((x2%BLK>=1&&x2%BLK<=4)&&(y2%BLK>=1&&y2%BLK<=4))continue;
    obst(x,y);obst(x2,y2);props.push({k:'car',x,y,w:vert?1:2,h:vert?2:1,vert,col:pick(['#7a1f2b','#1f4a7a','#cfcfcf','#2b2b2b','#6b5a1f','#1f6b4a','#5a2a6b']),wreck:Math.random()<.5,flip:Math.random()<.5});cars++}
  // street lamps
  for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){
    if(T(x,y)!==WALK)continue;const ox=x%BLK,oy=y%BLK;
    if((ox===0||ox===5)&&oy>5&&y%7===3)lamps.push({x:(x+.5)*TILE,y:(y+.5)*TILE,on:Math.random()<.72,fl:Math.random()<.25});

  }

}
function genBuilding(x0,y0){
  const m=ri(1,2),bx=x0+m,by=y0+m,bw=18-2*m-ri(0,3),bh=18-2*m-ri(0,3);
  const p1=ri(0,FLOORS.length-1),p2=ri(0,FLOORS.length-1),p3=ri(0,FLOORS.length-1);
  for(let y=by;y<by+bh;y++)for(let x=bx;x<bx+bw;x++){
    const edge=x===bx||y===by||x===bx+bw-1||y===by+bh-1;setT(x,y,edge?WALL:FLOOR,p1);
  }
  let px=-1,py=-1;
  if(bw>=10){px=bx+ri(4,bw-5);const gy=ri(by+2,by+bh-4);
    for(let y=by;y<by+bh;y++){if(y===gy||y===gy+1)continue;setT(px,y,WALL)}
    for(let y=by+1;y<by+bh-1;y++)for(let x=px+1;x<bx+bw-1;x++)if(T(x,y)===FLOOR)fcol[y*MW+x]=p2;
    if(bh>=10){py=by+ri(4,bh-5);const gx=ri(px+2,bx+bw-4);
      for(let x=px;x<bx+bw;x++){if(x===gx||x===gx+1)continue;setT(x,py,WALL)}
      for(let y=py+1;y<by+bh-1;y++)for(let x=px+1;x<bx+bw-1;x++)if(T(x,y)===FLOOR)fcol[y*MW+x]=p3;
    }
  }
  // exterior doors
  const sides=[0,1,2,3].sort(()=>Math.random()-.5);let doors=0;
  for(const s of sides){if(doors>=2&&Math.random()<.5)continue;
    for(let k=0;k<20;k++){
      let x,y,dx,dy;
      if(s===0||s===1){x=ri(bx+1,bx+bw-3);y=s===0?by:by+bh-1;dx=1;dy=0;if(x===px||x+1===px)continue}
      else{y=ri(by+1,by+bh-3);x=s===2?bx:bx+bw-1;dx=0;dy=1;if(y===py||y+1===py)continue}
      setT(x,y,FLOOR,p1);setT(x+dx,y+dy,FLOOR,p1);

      doors++;break;
    }
  }
  // furniture (only tiles not touching walls — never blocks doors)
  const nF=ri(3,8);
  for(let i=0;i<nF;i++){const x=ri(bx+2,bx+bw-3),y=ri(by+2,by+bh-3);let ok=T(x,y)===FLOOR;
    for(let dy=-1;dy<=1&&ok;dy++)for(let dx=-1;dx<=1;dx++)if(T(x+dx,y+dy)===WALL||T(x+dx,y+dy)===OBST)ok=false;
    if(ok&&obst(x,y))props.push({k:pick(['crate','shelf','table','sofa','fridge']),x,y,w:1,h:1,rot:ri(0,3)})}

  if(px>0){if(py>0){rooms.push([px,by,bx+bw-px,py-by]);rooms.push([px,py,bx+bw-px,by+bh-py])}else rooms.push([px,by,bx+bw-px,bh])}
  for(const r of rooms)if(Math.random()<.7)blights.push({x:(r[0]+r[2]/2)*TILE,y:(r[1]+r[3]/2)*TILE,r:Math.max(r[2],r[3])*TILE*.55,c:pick(LIGHTC),fl:Math.random()<.2});
  // rugs (decoration, walkable)
  if(Math.random()<.6)props.push({k:'rug',x:bx+2,y:by+2,w:ri(2,3),h:ri(2,3),col:pick(['#5a1a2a','#1a3a5a','#5a4a1a'])});
}
function genPark(x0,y0){
  for(let y=y0;y<y0+18;y++)for(let x=x0;x<x0+18;x++)setT(x,y,GRASS);
  const n=ri(12,22);
  for(let i=0;i<n;i++){const x=ri(x0+1,x0+16),y=ri(y0+1,y0+16);let ok=true;
    for(let dy=-1;dy<=1&&ok;dy++)for(let dx=-1;dx<=1;dx++)if(solid(x+dx,y+dy))ok=false;

function genLot(x0,y0){

function updateZombie(z,dt){

  // stats
  if(!isTouch||keys.Tab){
    const stats=d.t==='g'?[['УРОН',Math.round(d.dmg)+(d.pel>1?'×'+d.pel:''),Math.sqrt(d.dmg*d.pel/320)],['СКОРОСТРЕЛЬНОСТЬ',d.rpm+' выстр/мин',d.rpm/1200],['ОТДАЧА',d.rec,d.rec/35],['ГРОМКОСТЬ',d.db+' дБ',(d.db-50)/130],['СКОРОСТЬ ПУЛИ',d.vel+' м/с',d.vel/950],['ВЕС',d.kg+' кг',d.kg/14]]
      :[['УРОН',d.dmg+(d.sty==='saw'?'/тик':''),Math.sqrt(d.dmg/170)],['СКОРОСТЬ УДАРА',(60/d.sw|0)+' уд/мин',Math.min(1,(1/d.sw)/4)],['ДАЛЬНОСТЬ',(d.rng/32).toFixed(1)+' м',d.rng/70],['ГРОМКОСТЬ',d.db+' дБ',(d.db-50)/130],['ОТБРАСЫВАНИЕ',d.kb,d.kb/620],['ВЕС',d.kg+' кг',d.kg/6]];
    const sx=W-pad-S(300),sy0=H*.36;ctx.fillStyle='rgba(8,2,18,.55)';ctx.fillRect(sx-S(10),sy0-S(18),S(310),stats.length*S(22)+S(14));
    stats.forEach((s,i)=>{const y=sy0+i*S(22);ctx.textAlign='left';ctx.font=F(S(10.5));ctx.fillStyle='#d0c0e0';ctx.fillText(s[0],sx,y);
      ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(sx+S(130),y-S(9),S(100),S(9));ctx.fillStyle=i===3?'#ff2d95':'#22e6ff';ctx.fillRect(sx+S(130),y-S(9),S(100)*clamp(s[2],0.03,1),S(9));
      ctx.textAlign='right';ctx.fillStyle='#fff';ctx.fillText(s[1],sx+S(300),y)});
  }

  ctx.save();ctx.globalAlpha=.85;ctx.fillStyle='#000';ctx.fillRect(mx-3,my-3,ms+6,ms+6);
  const view=36;const ptx=p.x/TILE,pty=p.y/TILE;ctx.imageSmoothingEnabled=false;
  ctx.drawImage(mini,ptx-view/2,pty-view/2,view,view,mx,my,ms,ms);ctx.imageSmoothingEnabled=true;
  const k=ms/view;ctx.fillStyle='#ff3050';for(const z of zombies){if(z.dead||z.sleep)continue;const dx=(z.x/TILE-ptx),dy=(z.y/TILE-pty);if(Math.abs(dx)<view/2&&Math.abs(dy)<view/2&&(z.state==='chase'||Math.hypot(dx,dy)<9))ctx.fillRect(mx+ms/2+dx*k-1.5,my+ms/2+dy*k-1.5,3,3)}
  ctx.fillStyle='#22e6ff';ctx.beginPath();ctx.arc(mx+ms/2,my+ms/2,3.5,0,7);ctx.fill();ctx.strokeStyle='#22e6ff';ctx.beginPath();ctx.moveTo(mx+ms/2,my+ms/2);ctx.lineTo(mx+ms/2+Math.cos(p.ang)*10,my+ms/2+Math.sin(p.ang)*10);ctx.stroke();

function drawTouchUI(){

    let kx=ox,ky=oy;if(s){const dx=s.x-s.ox,dy=s.y-s.oy,m=Math.hypot(dx,dy);const c=Math.min(m,R);if(m>0){kx=ox+dx/m*c;ky=oy+dy/m*c}}
    ctx.globalAlpha=.6;ctx.fillStyle=col;ctx.beginPath();ctx.arc(kx,ky,R*.42,0,7);ctx.fill();ctx.globalAlpha=1};

    ctx.font=F(b.r*(b.lab.length>2?.45:.7));ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(b.lab,b.x,b.y+b.r*.25)}

function drawOverlay(){

function drawTitle(){

function drawDead(){

// ================================================================

// ================================================================
genMap();
player={x:SPX*TILE,y:SPY*TILE,r:13,vx:0,vy:0,ang:0,hp:100,st:100,inv:[mkWeapon(0)],cur:0,phase:0,ammo:{},kick:0,flashT:0,drawT:0,atkT:0,reloadT:0,recoil:0,bloom:0};

requestAnimationFrame(loop);
