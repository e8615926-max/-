<title>LAST SHELTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=PT+Sans:wght@400;700&display=swap">
<style>
/* Один мир — тёмный бункер с янтарными лампами. Холст игры на всё окно, поверх — загрузка и подсказки. */
:root {
  --bunker: #14110f;
  --panel: #231e19;
  --panel-light: #332b24;
  --border: #6b5a45;
  --amber: #e8b04a;
  --amber-deep: #6e4f1c;
  --text: #efe6d0;
  --text-dim: #a89c86;
  --alarm: #e0655a;
  --font-display: "Press Start 2P", "Courier New", monospace;
  --font-body: "PT Sans", "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bunker);
  color: var(--text);
  font-family: var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  right: env(safe-area-inset-right, 0px);
  bottom: env(safe-area-inset-bottom, 0px);
  left: env(safe-area-inset-left, 0px);
  background: var(--bunker);
}
#canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  outline: none;
}
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.25rem;
  padding-block: 1.5rem;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  background: var(--bunker);
  text-align: center;
}
.logo {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(1.6rem, 6vw, 3.2rem);
  line-height: 1.25;
  letter-spacing: 0.04em;
  color: var(--amber);
  text-shadow: 0.18em 0.18em 0 var(--amber-deep);
  text-wrap: balance;
}
.tagline { margin: 0; color: var(--text-dim); font-size: 1rem; }
.meter {
  width: min(22rem, 80%);
  height: 1.1rem;
  border: 3px solid var(--border);
  background: var(--panel);
  padding: 2px;
}
.meter-fill {
  height: 100%;
  width: 0%;
  background: repeating-linear-gradient(90deg, var(--amber) 0 10px, #c9922f 10px 12px);
  transition: width 0.2s linear;
}
.status-label {
  margin: 0;
  font-family: var(--font-display);
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}
.notice {
  max-width: 34rem;
  margin: 0;
  padding: 1rem 1.25rem;
  border: 2px solid var(--alarm);
  background: var(--panel);
  color: var(--text);
  line-height: 1.45;
}
.rotate { display: none; z-index: 2; }
.rotate-phone {
  width: 3.5rem;
  height: 6rem;
  border: 4px solid var(--amber);
  border-radius: 0.6rem;
  animation: turn 2.4s ease-in-out infinite;
}
.rotate p { margin: 0; font-size: 1.15rem; max-width: 18rem; }
.actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
.btn {
  font: 700 1rem var(--font-body);
  color: var(--text);
  background: var(--panel-light);
  border: 2px solid var(--border);
  border-bottom-width: 5px;
  padding: 0.7rem 1.1rem;
  cursor: pointer;
}
.btn-accent { background: var(--amber-deep); border-color: var(--amber); color: #f7d58a; }
.btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
@keyframes turn { 0%, 25% { transform: rotate(0deg); } 55%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (max-width: 820px) {
  .rotate:not(.dismissed) { display: flex; }
}
@media (prefers-reduced-motion: reduce) {
  .rotate-phone { animation: none; transform: rotate(-90deg); }
  .meter-fill { transition: none; }
}
</style>

<div id="stage">
  <canvas id="canvas" tabindex="0">Ваш браузер не поддерживает canvas.</canvas>
  <div id="status" class="overlay">
    <h1 class="logo">LAST<br>SHELTER</h1>
    <p class="tagline">Последнее убежище. Выживи под землёй.</p>
    <div class="meter" role="progressbar" aria-label="Загрузка игры" aria-valuemin="0" aria-valuemax="100">
      <div id="status-bar" class="meter-fill"></div>
    </div>
    <p id="status-label" class="status-label">ЗАГРУЗКА…</p>
    <p id="status-notice" class="notice" hidden></p>
  </div>
  <div id="rotate" class="overlay rotate">
    <div class="rotate-phone" aria-hidden="true"></div>
    <p>Игра рассчитана на горизонтальный экран. Поверните телефон.</p>
    <div class="actions">
      <button id="btn-fullscreen" class="btn btn-accent" type="button">Во весь экран</button>
      <button id="btn-portrait" class="btn" type="button">Играть так</button>
    </div>
  </div>
</div>
<noscript>Для игры нужен JavaScript.</noscript>

<script>
// Движок и данные игры лежат рядом сжатыми (gzip) под именами, которые отдаёт хостинг:
// engine.wasm — движок Godot, game-data.wasm — пакет игры. Подменяем их загрузку и распаковываем в браузере.
(function () {
  const realFetch = window.fetch.bind(window);
  const FILES = [
    [/(^|\/)index\.wasm(\?.*)?$/, 'engine.wasm', 'application/wasm'],
    [/(^|\/)index\.pck(\?.*)?$/, 'game-data.wasm', 'application/octet-stream'],
  ];

  function loadPako() {
    return new Promise(function (resolve, reject) {
      if (window.pako) { resolve(window.pako); return; }
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js';
      s.onload = function () { resolve(window.pako); };
      s.onerror = function () { reject(new Error('Не удалось загрузить распаковщик')); };
      document.head.appendChild(s);
    });
  }

  async function unpack(res, type) {
    const reader = res.body.getReader();
    const first = await reader.read();
    const head = first.value || new Uint8Array(0);
    const gzipped = head.length > 1 && head[0] === 0x1f && head[1] === 0x8b;
    const stream = new ReadableStream({
      start(controller) {
        if (head.length) controller.enqueue(head);
        if (first.done) controller.close();
      },
      async pull(controller) {
        const next = await reader.read();
        if (next.done) controller.close(); else controller.enqueue(next.value);
      },
    });
    let body = stream;
    if (gzipped) {
      if (typeof DecompressionStream === 'function') {
        body = stream.pipeThrough(new DecompressionStream('gzip'));
      } else {
        const pako = await loadPako();
        body = pako.ungzip(new Uint8Array(await new Response(stream).arrayBuffer()));
      }
    }
    return new Response(body, { status: 200, headers: { 'Content-Type': type } });
  }

  window.fetch = function (input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    for (const [pattern, target, type] of FILES) {
      if (pattern.test(url)) {
        const real = url.replace(pattern, function (match, prefix) { return prefix + target; });
        return realFetch(real, init).then(function (res) {
          if (!res.ok) throw new Error('Файл ' + target + ' не найден (' + res.status + ')');
          return unpack(res, type);
        });
      }
    }
    return realFetch(input, init);
  };
})();
</script>
<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
(function () {
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('canvas');
  const status = document.getElementById('status');
  const bar = document.getElementById('status-bar');
  const label = document.getElementById('status-label');
  const notice = document.getElementById('status-notice');
  const rotate = document.getElementById('rotate');

  // Размер холста задаём сами (политика «без изменений» в экспорте): по контейнеру и плотности экрана.
  function fitCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(stage.clientWidth * dpr));
    const h = Math.max(1, Math.round(stage.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
  }
  fitCanvas();
  if (typeof ResizeObserver === 'function') new ResizeObserver(fitCanvas).observe(stage);
  window.addEventListener('resize', fitCanvas);

  document.getElementById('btn-portrait').addEventListener('click', function () {
    rotate.classList.add('dismissed');
    canvas.focus();
  });
  document.getElementById('btn-fullscreen').addEventListener('click', function () {
    const el = document.documentElement;
    const request = el.requestFullscreen ? el.requestFullscreen() : Promise.reject(new Error('нет полноэкранного режима'));
    request.then(function () {
      if (screen.orientation && screen.orientation.lock) return screen.orientation.lock('landscape');
      return null;
    }).catch(function () {}).finally(function () {
      rotate.classList.add('dismissed');
      canvas.focus();
    });
  });

  function fail(err) {
    console.error(err);
    status.hidden = false;
    label.textContent = 'ОШИБКА';
    notice.hidden = false;
    const text = String((err && err.message) || err);
    notice.textContent = /WebAssembly|wasm|unsafe-eval/i.test(text)
      ? 'Этот просмотрщик не разрешает запускать игровой движок (WebAssembly). Откройте страницу в обычном браузере. Подробности: ' + text
      : 'Не удалось запустить игру: ' + text;
  }

  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length !== 0) {
    fail(new Error('браузеру не хватает возможностей: ' + missing.join(', ')));
    return;
  }
  const engine = new Engine(GODOT_CONFIG);
  engine.startGame({
    onProgress: function (current, total) {
      if (current > 0 && total > 0) {
        const p = Math.min(100, Math.round((current / total) * 100));
        bar.style.width = p + '%';
        label.textContent = 'ЗАГРУЗКА ' + p + '%';
      }
    },
  }).then(function () {
    status.hidden = true;
    canvas.focus();
  }, fail);
})();
</script>
